[pytest]
# Pytest configuration for Cloud OS Backend

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
minversion = 7.0

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow running tests
    skip_ci: Skip in CI environment

# Coverage
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-fail-under=70

asyncio_mode = auto

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
